name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend dependencies
        run: |
          cd backend
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt

      - name: Backend tests
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/bloodconnect_test
          JWT_SECRET: test_jwt_secret_for_ci_pipeline_32chars
          APP_ENV: test
        run: |
          cd backend
          .venv/bin/python -m pytest --cov=app --cov-config=.coveragerc --cov-report=term-missing

      - name: Frontend dependencies
        run: npm ci --prefix frontend

      - name: Frontend tests
        run: npm --prefix frontend run test:coverage

      - name: Frontend lint
        run: npm --prefix frontend run lint
