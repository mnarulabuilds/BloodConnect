services:
  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo_dev_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      # Host 5001 avoids macOS AirPlay Receiver on 5000
      - '5001:5000'
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/bloodconnect
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production_min_32_chars}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8081,http://127.0.0.1:8081}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8081}
    volumes:
      - ./backend:/app
    depends_on:
      mongo:
        condition: service_healthy
    command: uvicorn app.main:combined_app --host 0.0.0.0 --port 5000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - '8081:8081'
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    command: npx expo start --web --port 8081 --host lan

volumes:
  mongo_dev_data:
  frontend_node_modules:
